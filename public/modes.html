<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5e9" />
    <meta name="description" content="选择交互、沉浸或伴游模式，和窗小游一起探索深圳世界之窗。" />
    <title>选择游览模式 · 世界之旅</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/arrival/pages.css" />
  </head>
  <body class="arrival arrival-modes" data-page="modes">
    <main class="modes-page" aria-labelledby="modes-title">
      <img class="modes-leaves" src="./assets/arrival/leaves.png" width="332" height="159" alt="" />
      <nav class="modes-navigation" aria-label="页面导航"><a class="arrival-back" href="./index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg>返回</a><span>世界之旅 · AI 伴游</span></nav>
      <header class="modes-heading">
        <h1 id="modes-title">选择游览模式</h1>
        <p><span aria-hidden="true">❧</span>和窗小游一起探索<span aria-hidden="true">❧</span></p>
      </header>
      <ol class="mode-cards" aria-label="三种游览方式">
        <li><a class="arrival-mode-card" href="./tour.html?mode=interactive" aria-labelledby="interactive-title" aria-describedby="interactive-description">
          <div class="mode-card-topline" aria-hidden="true"><span>01</span><span><i></i>边聊边逛</span></div>
          <div class="mode-card-stage"><span class="mode-stage-orbit" aria-hidden="true"></span><img class="mode-card-illustration mode-card-otter" src="./assets/arrival/mode-interactive.png" width="752" height="347" alt="" fetchpriority="high" /></div>
          <div class="mode-card-caption"><div><h2 id="interactive-title">交互模式</h2><p id="interactive-description">语音互动，画面随心切换</p></div><span class="mode-card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></span></div>
        </a></li>
        <li><a class="arrival-mode-card" href="./tour.html?mode=immersive" aria-labelledby="immersive-title" aria-describedby="immersive-description">
          <div class="mode-card-topline" aria-hidden="true"><span>02</span><span><i></i>慢看风景</span></div>
          <div class="mode-card-stage"><span class="mode-stage-orbit" aria-hidden="true"></span><img class="mode-card-illustration" src="./assets/arrival/mode-immersive.png" width="741" height="252" alt="" /></div>
          <div class="mode-card-caption"><div><h2 id="immersive-title">沉浸模式</h2><p id="immersive-description">文字展示，沉浸探索景点</p></div><span class="mode-card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></span></div>
        </a></li>
        <li><a class="arrival-mode-card" href="./tour.html?mode=companion" aria-labelledby="companion-title" aria-describedby="companion-description">
          <div class="mode-card-topline" aria-hidden="true"><span>03</span><span><i></i>听着出发</span></div>
          <div class="mode-card-stage"><span class="mode-stage-orbit" aria-hidden="true"></span><img class="mode-card-illustration" src="./assets/arrival/mode-companion.png" width="752" height="272" alt="" /></div>
          <div class="mode-card-caption"><div><h2 id="companion-title">伴游模式</h2><p id="companion-description">无需看屏，语音导览随行</p></div><span class="mode-card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></span></div>
        </a></li>
      </ol>
      <footer class="modes-footer"><p>按你喜欢的方式出发，途中也能随时切换</p><div class="arrival-progress" aria-label="第 2 步，共 2 步"><span></span><span class="is-current"></span></div><img src="./assets/arrival/meadow.png" width="852" height="130" alt="" /></footer>
    </main>
    <script type="module" src="/src/modes-page.js"></script>
  </body>
</html>
